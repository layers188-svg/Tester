# Supabase CLI project configuration.
# Run `supabase link --project-ref <ref>` once a real project exists
# (brief §23 item 1), then `supabase db push` to apply
# supabase/migrations/*.sql.

project_id = "house-dark"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# One time code sign-in only — no password (brief §13).
otp_length = 6
otp_expiry = 300

[storage]
enabled = true
file_size_limit = "25MiB"
